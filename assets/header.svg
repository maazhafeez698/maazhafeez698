<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
      <animate attributeName="x1" values="-40%;140%" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60%;240%" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="34 34" dur="9s" repeatCount="indefinite"/>
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="260" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="257" rx="17" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- corner frame accents -->
  <text x="34" y="52" font-family="Courier New, monospace" font-size="26" fill="#3a3a3a">[</text>
  <text x="1146" y="228" font-family="Courier New, monospace" font-size="26" fill="#3a3a3a">]</text>

  <!-- floating background symbols, each animated independently -->
  <text x="90" y="70" font-family="Courier New, monospace" font-size="22" fill="#ffffff" fill-opacity="0.08">
    { }
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="1030" y="60" font-family="Courier New, monospace" font-size="20" fill="#ffffff" fill-opacity="0.08">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="4.2s" repeatCount="indefinite"/>
  </text>
  <text x="70" y="205" font-family="Courier New, monospace" font-size="18" fill="#ffffff" fill-opacity="0.07">
    01
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="1080" y="200" font-family="Courier New, monospace" font-size="20" fill="#ffffff" fill-opacity="0.08">
    ( )
    <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="4.7s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="145" font-family="Courier New, monospace" font-size="16" fill="#ffffff" fill-opacity="0.06">
    ;
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="3.8s" repeatCount="indefinite"/>
  </text>
  <text x="1000" y="150" font-family="Courier New, monospace" font-size="16" fill="#ffffff" fill-opacity="0.07">
    =&gt;
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.4s" repeatCount="indefinite"/>
  </text>

  <!-- terminal prompt line -->
  <text x="600" y="86" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#6e6e6e" letter-spacing="1">$ whoami</text>

  <!-- main name -->
  <text x="600" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)" filter="url(#softGlow)" letter-spacing="2">
    MAAZ HAFEEZ
  </text>

  <!-- animated shimmer underline -->
  <rect x="380" y="164" width="440" height="2" fill="url(#lineGrad)"/>

  <!-- subtitle with blinking cursor -->
  <text x="600" y="200" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#a0a0a0" letter-spacing="0.5">
    &gt; Full Stack Developer — MERN · PERN · Next.js
  </text>
  <rect x="878" y="188" width="9" height="16" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
