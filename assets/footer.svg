<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="110" viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
      <animate attributeName="x1" values="-30%;130%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="70%;230%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="110" fill="url(#fBgGrad)"/>

  <!-- static faint base line -->
  <rect x="0" y="54" width="1200" height="1" fill="#2a2a2a"/>

  <!-- animated data-stream line on top -->
  <rect x="0" y="53" width="1200" height="3" fill="url(#streamGrad)"/>

  <!-- small tick marks along the line -->
  <g fill="#3a3a3a">
    <rect x="120" y="50" width="1" height="9"/>
    <rect x="360" y="50" width="1" height="9"/>
    <rect x="600" y="50" width="1" height="9"/>
    <rect x="840" y="50" width="1" height="9"/>
    <rect x="1080" y="50" width="1" height="9"/>
  </g>

  <text x="600" y="86" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#5a5a5a" letter-spacing="1">
    building in public — one commit at a time
  </text>
</svg>
