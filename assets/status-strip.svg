<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="46" viewBox="0 0 480 46" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="480" height="46" rx="10" fill="#0d0d0d" stroke="#242424" stroke-width="1"/>

  <circle cx="26" cy="23" r="5" fill="#e6e6e6" filter="url(#dotGlow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="44" y="28" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9" letter-spacing="0.5">
    status: actively building
  </text>
</svg>
